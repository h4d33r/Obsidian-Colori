name: Run IOC deduplication fix

on:
  push:
    branches: [dev]
    paths:
      - .github/run-ioc-dedupe

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/scripts/dedupe_ioc_domains.py
      - run: node --check main.js
      - run: |
          git config user.name "H4d33r"
          git config user.email "79756288+h4d33r@users.noreply.github.com"
          git add main.js
          git commit -m "fix: deduplicate URL domains in IOC results"
          git push origin dev
