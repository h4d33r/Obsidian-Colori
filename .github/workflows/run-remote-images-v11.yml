name: Run remote image detection fix

on:
  push:
    branches:
      - dev
    paths:
      - .github/run-remote-images-v11

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/scripts/fix_remote_images_v11.py
      - run: node --check main.js
      - run: |
          git config user.name "H4d33r"
          git config user.email "79756288+h4d33r@users.noreply.github.com"
          git add main.js manifest.json versions.json
          git diff --cached --check
          git commit -m "fix: detect remote markdown images reliably"
          git push origin dev
