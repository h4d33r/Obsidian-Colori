name: Patch sidebar UX v3

on:
  push:
    branches: [dev]
    paths:
      - .github/run-sidebar-v3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch main.js and styles.css
        shell: python
        run: |
          from pathlib import Path

          p = Path('main.js')
          s = p.read_text(encoding='utf-8')

          def one(old, new):
              global s
              if old not in s:
                  raise SystemExit('Expected block not found:\n' + old[:300])
              s = s.replace(old, new, 1)

          one('''    const rememberMarkdown = () => {\n      const view = this.app.workspace.getActiveViewOfType(MarkdownView);\n      if (view?.file instanceof TFile) this.lastMarkdownPath = view.file.path;\n      this.refreshSidebar();\n    };\n    this.registerEvent(this.app.workspace.on("file-open", rememberMarkdown));\n    this.registerEvent(this.app.workspace.on("active-leaf-change", rememberMarkdown));\n\n    const block = (event) => this.blockExternalLinkEvent(event);\n    for (const eventName of ["pointerdown", "mousedown", "click", "auxclick"]) {\n      this.registerDomEvent(document, eventName, block, true);\n    }\n''', '''    const rememberMarkdown = () => {\n      const view = this.app.workspace.getActiveViewOfType(MarkdownView);\n      if (!(view?.file instanceof TFile)) return;\n      const changed = this.lastMarkdownPath !== view.file.path;\n      this.lastMarkdownPath = view.file.path;\n      if (changed) this.refreshSidebar();\n    };\n    this.registerEvent(this.app.workspace.on("file-open", rememberMarkdown));\n    this.registerEvent(this.app.workspace.on("active-leaf-change", rememberMarkdown));\n''')

          one('''    root.style.setProperty("--graph-node", this.settings.noteColor);\n    root.style.setProperty("--graph-node-focused", this.settings.activeNoteColor);\n    this.renderOverrideCss();\n''', '''    root.style.setProperty("--graph-node", this.settings.noteColor);\n    root.style.setProperty("--graph-node-focused", this.settings.activeNoteColor);\n    root.classList.toggle("ct-safe-links", this.settings.safeLinksEnabled);\n    this.renderOverrideCss();\n''')

          one('''    for (const name of ["--ct-folder-icon", "--ct-note-icon", "--graph-node", "--graph-node-focused"]) {\n      root.style.removeProperty(name);\n    }\n''', '''    for (const name of ["--ct-folder-icon", "--ct-note-icon", "--graph-node", "--graph-node-focused"]) {\n      root.style.removeProperty(name);\n    }\n    root.classList.remove("ct-safe-links");\n''')

          start = s.index('  blockExternalLinkEvent(event) {')
          end = s.index('  getTrackedFile() {', start)
          s = s[:start] + s[end:]

          old_transform = '''  async transformTrackedNote(mode) {\n    const file = this.getTrackedFile();\n    if (!file) return false;\n    const editor = this.getEditorForFile(file);\n    let changed = false;\n    if (editor) changed = this.transformEditor(editor, file, mode);\n    else {\n      const transform = mode === "refang" ? refangUrlText : defangUrlText;\n      const current = await this.app.vault.read(file);\n      const updated = transform(current);\n      if (updated !== current) {\n        await this.app.vault.modify(file, updated);\n        changed = true;\n      }\n    }\n    this.refreshSidebar();\n    if (changed) new Notice(mode === "refang" ? "URLs refanged." : "URLs defanged.");\n    return changed;\n  }\n'''
          new_transform = '''  async transformTrackedNote(mode) {\n    const file = this.getTrackedFile();\n    if (!file) return false;\n    const transform = mode === "refang" ? refangUrlText : defangUrlText;\n    const current = await this.app.vault.read(file);\n    const updated = transform(current);\n    if (updated === current) return false;\n    await this.app.vault.modify(file, updated);\n    new Notice(mode === "refang" ? "URLs refanged." : "URLs defanged.");\n    return true;\n  }\n'''
          one(old_transform, new_transform)

          insert_before = '  async openSidebar() {'
          counts_method = '''  countIocs(text) {\n    const source = typeof text === "string" ? text : "";\n    const counts = { URL: 0, IP: 0, Domain: 0, Hash: 0, Email: 0 };\n    const countMatches = (kind, regex, validate) => {\n      regex.lastIndex = 0;\n      let match;\n      const seen = new Set();\n      while ((match = regex.exec(source))) {\n        const value = match[0];\n        if ((!validate || validate(value)) && !seen.has(value.toLowerCase())) {\n          seen.add(value.toLowerCase());\n          counts[kind]++;\n        }\n        if (match.index === regex.lastIndex) regex.lastIndex++;\n      }\n    };\n    countMatches("URL", /\\b(?:https?|hxxps?):\\/\\/[^\\s<>"'`]+/gi);\n    countMatches("IP", /\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b/g, (value) => value.split(".").every((part) => Number(part) <= 255));\n    countMatches("Hash", /\\b(?:[a-f0-9]{64}|[a-f0-9]{40}|[a-f0-9]{32})\\b/gi);\n    countMatches("Email", /\\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}\\b/gi);\n    countMatches("Domain", /\\b(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\\.|\\[\\.\\]))+[a-z]{2,63}\\b/gi);\n    counts.Total = counts.URL + counts.IP + counts.Domain + counts.Hash + counts.Email;\n    return counts;\n  }\n\n'''
          if insert_before not in s:
              raise SystemExit('openSidebar marker missing')
          s = s.replace(insert_before, counts_method + insert_before, 1)

          class_start = s.index('class NoteToolsView extends ItemView {')
          class_end = s.index('class NoteSuggestModal extends FuzzySuggestModal {', class_start)
          new_class = r'''class NoteToolsView extends ItemView {
  constructor(leaf, plugin) {
    super(leaf);
    this.plugin = plugin;
    this.openSections = new Set();
    this.scanTypes = new Set(["url", "ip", "domain", "hash", "email"]);
    this.scanLimit = 25;
    this.scanResults = null;
    this.scanPath = null;
  }

  getViewType() { return VIEW_TYPE; }
  getDisplayText() { return "Note Tools"; }
  getIcon() { return "shield-check"; }

  async onOpen() {
    await this.render();
  }

  makeDropdown(parent, key, title) {
    const details = parent.createEl("details", { cls: "ct-tools-dropdown" });
    details.open = this.openSections.has(key);
    details.addEventListener("toggle", () => {
      if (details.open) this.openSections.add(key);
      else this.openSections.delete(key);
    });
    details.createEl("summary", { text: title });
    return details.createDiv({ cls: "ct-tools-dropdown-body" });
  }

  async readTrackedText(file) {
    const editor = this.plugin.getEditorForFile(file);
    return editor ? editor.getValue() : this.app.vault.cachedRead(file);
  }

  async render() {
    const container = this.containerEl.children[1];
    if (!container) return;
    container.empty();
    container.addClass("ct-sidebar");
    container.createEl("h3", { text: "Note Tools" });

    const file = this.plugin.getTrackedFile();
    if (!(file instanceof TFile)) {
      container.createEl("p", { text: "Open a Markdown note to use these tools.", cls: "ct-muted" });
      return;
    }

    this.plugin.lastMarkdownPath = file.path;
    if (this.scanPath && this.scanPath !== file.path) {
      this.scanResults = null;
      this.scanPath = null;
    }

    container.createEl("div", { text: file.basename, cls: "ct-sidebar-note" });
    container.createEl("div", { text: file.path, cls: "ct-sidebar-path" });

    const text = await this.readTrackedText(file);
    const counts = this.plugin.countIocs(text);

    const summary = container.createDiv({ cls: "ct-ioc-summary" });
    summary.createEl("strong", { text: `IOCs: ${counts.Total}` });
    summary.createEl("span", { text: `URLs ${counts.URL} · IPs ${counts.IP} · Domains ${counts.Domain} · Hashes ${counts.Hash} · Emails ${counts.Email}` });

    const safeBody = this.makeDropdown(container, "safe", "Safe Links");
    safeBody.createEl("div", {
      text: this.plugin.settings.safeLinksEnabled ? "Protection is ON" : "Protection is OFF",
      cls: this.plugin.settings.safeLinksEnabled ? "ct-status ct-status-on" : "ct-status"
    });
    safeBody.createEl("p", {
      text: "When enabled, external web links in Markdown notes are not clickable. Change this in plugin settings.",
      cls: "ct-muted"
    });

    const defangBody = this.makeDropdown(container, "defang", "Defang / Refang");
    const transformActions = defangBody.createDiv({ cls: "ct-sidebar-actions" });
    const defang = transformActions.createEl("button", { text: "Defang note" });
    defang.addEventListener("click", async () => {
      const changed = await this.plugin.transformTrackedNote("defang");
      if (changed) await this.render();
    });
    const refang = transformActions.createEl("button", { text: "Refang note" });
    refang.addEventListener("click", async () => {
      const changed = await this.plugin.transformTrackedNote("refang");
      if (changed) await this.render();
    });
    defangBody.createEl("p", { text: "These sidebar buttons always process the whole tracked note. Use the Command Palette commands when you want to process only selected text.", cls: "ct-muted" });

    const iocBody = this.makeDropdown(container, "ioc", "IOC Scanner");
    const typeBox = iocBody.createDiv({ cls: "ct-ioc-type-grid" });
    const choices = [["url", "URLs"], ["ip", "IPs"], ["domain", "Domains"], ["hash", "Hashes"], ["email", "Emails"]];
    for (const [value, label] of choices) {
      const item = typeBox.createEl("label", { cls: "ct-ioc-check" });
      const box = item.createEl("input", { type: "checkbox" });
      box.checked = this.scanTypes.has(value);
      box.addEventListener("change", () => {
        if (box.checked) this.scanTypes.add(value);
        else this.scanTypes.delete(value);
        this.scanResults = null;
      });
      item.createSpan({ text: label });
    }

    const limitRow = iocBody.createDiv({ cls: "ct-ioc-limit-row" });
    limitRow.createSpan({ text: "Maximum results" });
    const limitSelect = limitRow.createEl("select");
    for (const limit of [10, 25, 50, 100, 250]) {
      const option = limitSelect.createEl("option", { value: String(limit), text: String(limit) });
      if (limit === this.scanLimit) option.selected = true;
    }
    limitSelect.addEventListener("change", () => {
      this.scanLimit = Number(limitSelect.value);
      this.scanResults = null;
    });

    const scanButton = iocBody.createEl("button", { text: "Scan current note", cls: "ct-sidebar-wide-button" });
    scanButton.addEventListener("click", async () => {
      if (!this.scanTypes.size) {
        new Notice("Choose at least one IOC type.");
        return;
      }
      const currentFile = this.plugin.getTrackedFile();
      if (!(currentFile instanceof TFile)) return;
      const currentText = await this.readTrackedText(currentFile);
      const wanted = [...this.scanTypes];
      const all = [];
      for (const type of wanted) {
        if (all.length >= this.scanLimit) break;
        const remaining = this.scanLimit - all.length;
        all.push(...this.plugin.scanIocs(currentText, type, remaining));
      }
      this.scanResults = all.slice(0, this.scanLimit);
      this.scanPath = currentFile.path;
      this.openSections.add("ioc");
      await this.render();
    });

    if (this.scanResults && this.scanPath === file.path) {
      const grouped = new Map();
      for (const item of this.scanResults) {
        if (!grouped.has(item.type)) grouped.set(item.type, []);
        grouped.get(item.type).push(item.value);
      }
      const resultBox = iocBody.createDiv({ cls: "ct-ioc-results" });
      resultBox.createEl("div", { text: `${this.scanResults.length} shown`, cls: "ct-muted" });
      for (const [type, values] of grouped.entries()) {
        resultBox.createEl("div", { text: `${type}${values.length === 1 ? "" : "s"}`, cls: "ct-ioc-group-title" });
        for (const value of values) {
          const row = resultBox.createDiv({ cls: "ct-ioc-row" });
          row.createEl("code", { text: value });
          const copy = row.createEl("button", { text: "Copy" });
          copy.addEventListener("click", () => navigator.clipboard.writeText(value));
        }
      }
      if (this.scanResults.length) {
        const copyAll = iocBody.createEl("button", { text: "Copy shown results", cls: "ct-sidebar-wide-button" });
        copyAll.addEventListener("click", () => navigator.clipboard.writeText(this.scanResults.map((item) => item.value).join("\n")));
      }
    }

    const appearanceBody = this.makeDropdown(container, "appearance", "Appearance");
    const existing = this.plugin.getOverride("file", file.path);
    const appearance = existing ? { ...existing } : { color: this.plugin.settings.noteColor, size: this.plugin.settings.noteSize, icon: "" };
    new Setting(appearanceBody).setName("Title color").addColorPicker((picker) =>
      picker.setValue(appearance.color).onChange(async (value) => {
        appearance.color = sanitizeColor(value, this.plugin.settings.noteColor);
        await this.plugin.upsertOverride("file", file.path, appearance);
      })
    );
    new Setting(appearanceBody).setName("Title size").addSlider((slider) =>
      slider.setLimits(10, 40, 1).setValue(appearance.size).setDynamicTooltip().onChange(async (value) => {
        appearance.size = sanitizeSize(value, 10, 40, this.plugin.settings.noteSize);
        await this.plugin.upsertOverride("file", file.path, appearance);
      })
    );
    new Setting(appearanceBody).setName("Icon").addText((input) =>
      input.setPlaceholder("Optional").setValue(appearance.icon || "").onChange(async (value) => {
        appearance.icon = sanitizeIcon(value);
        await this.plugin.upsertOverride("file", file.path, appearance);
      })
    );
    if (existing) {
      const reset = appearanceBody.createEl("button", { text: "Reset appearance", cls: "ct-sidebar-wide-button" });
      reset.addEventListener("click", async () => { await this.plugin.removeOverride("file", file.path); this.openSections.add("appearance"); await this.render(); });
    }

    const graphBody = this.makeDropdown(container, "graph", "Graph");
    const count = this.plugin.getOutgoingConnections(file.path).length;
    const graphActions = graphBody.createDiv({ cls: "ct-sidebar-actions" });
    const connect = graphActions.createEl("button", { text: "Connect note" });
    connect.addEventListener("click", () => new NoteSuggestModal(this.app, file.path, async (target) => {
      await this.plugin.addConnection(file, target);
      this.openSections.add("graph");
      await this.render();
    }).open());
    const manage = graphActions.createEl("button", { text: `Connections (${count})` });
    manage.addEventListener("click", () => new ConnectionsModal(this.app, this.plugin, file).open());
    graphBody.createEl("p", {
      text: this.plugin.settings.graphMatchNoteColors ? "Graph color matching is enabled globally." : "Graph color matching is disabled globally.",
      cls: "ct-muted"
    });

    const infoBody = this.makeDropdown(container, "info", "Note Info");
    const words = (text.match(/\S+/g) || []).length;
    const resolved = this.app.metadataCache.resolvedLinks || {};
    const outgoing = resolved[file.path] ? Object.keys(resolved[file.path]).length : 0;
    let backlinks = 0;
    for (const links of Object.values(resolved)) if (links && Object.prototype.hasOwnProperty.call(links, file.path)) backlinks++;
    const grid = infoBody.createDiv({ cls: "ct-note-info" });
    for (const [name, value] of [["Words", words], ["Backlinks", backlinks], ["Outgoing", outgoing], ["Created", new Date(file.stat.ctime).toLocaleString()], ["Modified", new Date(file.stat.mtime).toLocaleString()]]) {
      grid.createEl("span", { text: name, cls: "ct-note-info-label" });
      grid.createEl("span", { text: String(value), cls: "ct-note-info-value" });
    }
  }
}

'''
          s = s[:class_start] + new_class + s[class_end:]
          p.write_text(s, encoding='utf-8')

          css = Path('styles.css')
          c = css.read_text(encoding='utf-8')
          c += r'''

/* Safe Links: hard block inside Markdown notes */
body.ct-safe-links .workspace-leaf-content[data-type="markdown"] a[href^="http://"],
body.ct-safe-links .workspace-leaf-content[data-type="markdown"] a[href^="https://"],
body.ct-safe-links .workspace-leaf-content[data-type="markdown"] .external-link,
body.ct-safe-links .workspace-leaf-content[data-type="markdown"] .cm-url {
  pointer-events: none !important;
  cursor: not-allowed !important;
}

/* Persistent Note Tools dropdowns */
.ct-tools-dropdown {
  margin-top: 10px;
  border: 1px solid var(--background-modifier-border);
  border-radius: 8px;
  background: var(--background-secondary);
}

.ct-tools-dropdown > summary {
  padding: 10px 12px;
  cursor: pointer;
  user-select: none;
  font-weight: 600;
}

.ct-tools-dropdown-body {
  padding: 4px 12px 12px;
}

.ct-ioc-summary {
  margin: 10px 0 4px;
  padding: 9px 10px;
  border-radius: 7px;
  background: var(--background-secondary-alt);
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.ct-ioc-summary span {
  color: var(--text-muted);
  font-size: var(--font-ui-smaller);
  line-height: 1.45;
}

.ct-ioc-type-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px 10px;
  margin: 6px 0 10px;
}

.ct-ioc-check {
  display: flex;
  align-items: center;
  gap: 6px;
}

.ct-ioc-limit-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 8px 0;
}

.ct-ioc-group-title {
  margin: 12px 0 5px;
  font-size: var(--font-ui-small);
  font-weight: 700;
  color: var(--text-muted);
}
'''
          css.write_text(c, encoding='utf-8')
      - name: Syntax check
        run: node --check main.js
      - name: Commit fix
        run: |
          git config user.name "H4d33r"
          git config user.email "79756288+h4d33r@users.noreply.github.com"
          git add main.js styles.css
          git commit -m "fix: stabilize Note Tools and IOC scanner UX"
          git push origin dev
