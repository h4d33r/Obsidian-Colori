name: Colori graph compatibility patch

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/colori-feature-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Harden graph node collection
        shell: python
        run: |
          from pathlib import Path

          p = Path('main.js')
          s = p.read_text(encoding='utf-8')

          anchor = '''  getGraphNodePath(node) {'''
          helper = '''  getGraphNodes(renderer) {\n    const nodes = renderer?.nodes;\n    if (!nodes) return [];\n    if (Array.isArray(nodes)) return nodes;\n    if (nodes instanceof Map) return Array.from(nodes.values());\n    if (typeof nodes.values === "function") {\n      try {\n        return Array.from(nodes.values());\n      } catch (_) {\n        // Fall back to enumerable object values.\n      }\n    }\n    return Object.values(nodes);\n  }\n\n  getGraphNodePath(node) {'''
          if anchor not in s:
              raise SystemExit('Graph path anchor not found')
          s = s.replace(anchor, helper, 1)

          old = '''        const nodes = Array.isArray(renderer.nodes)\n          ? renderer.nodes\n          : Object.values(renderer.nodes || {});\n\n        for (const node of nodes) {'''
          new = '''        for (const node of this.getGraphNodes(renderer)) {'''
          if s.count(old) != 2:
              raise SystemExit(f'Expected two graph node collection blocks, found {s.count(old)}')
          s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
      - name: Syntax check
        run: node --check main.js
      - name: Commit compatibility fix
        run: |
          git config user.name "H4d33r"
          git config user.email "79756288+h4d33r@users.noreply.github.com"
          git add main.js
          git commit -m "fix: support Graph node map collections"
          git push origin dev
