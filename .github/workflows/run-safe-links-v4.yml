name: Run Safe Links v4 patch

on:
  push:
    branches: [dev]
    paths:
      - .github/run-safe-links-v4

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/scripts/patch_safe_links_v4.py
      - run: node --check main.js
      - run: |
          git config user.name "H4d33r"
          git config user.email "79756288+h4d33r@users.noreply.github.com"
          git add main.js styles.css
          git commit -m "fix: rebuild Safe Links and Markdown defanging"
          git push origin dev
