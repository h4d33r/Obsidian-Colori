name: Run Colori sidebar patch

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/colori-sidebar-run.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute stored patch
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/colori-sidebar-dev.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(text) if line.strip() == 'run: |') + 1
          end = next(i for i, line in enumerate(text[start:], start) if line.strip() == '- name: Syntax check')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end])
          exec(compile(code, 'colori-sidebar-patch', 'exec'))
          PY
      - name: Syntax check
        run: node --check main.js
      - name: Commit dev sidebar build
        run: |
          git config user.name "H4d33r"
          git config user.email "79756288+h4d33r@users.noreply.github.com"
          git add main.js styles.css manifest.json
          git commit -m "feat: add Colori sidebar workspace and Safe Links"
          git push origin dev
