name: Run Note Tools v5 patch

on:
  push:
    branches: [dev]
    paths:
      - .github/run-note-tools-v5

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/scripts/note_tools_v5.py
      - run: node --check main.js
      - run: |
          git config user.name "H4d33r"
          git config user.email "79756288+h4d33r@users.noreply.github.com"
          git add main.js styles.css
          git commit -m "feat: improve refang and Note Tools info"
          git push origin dev
