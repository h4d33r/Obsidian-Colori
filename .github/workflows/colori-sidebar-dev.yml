name: Build Colori sidebar dev

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/colori-sidebar-dev.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch dev build
        shell: python
        run: |
          from pathlib import Path

          p = Path('main.js')
          s = p.read_text(encoding='utf-8')

          def one(old, new):
              global s
              if old not in s:
                  raise SystemExit('Expected block not found:\n' + old[:250])
              s = s.replace(old, new, 1)

          one('''  PluginSettingTab,\n  Setting,\n  Modal,''', '''  PluginSettingTab,\n  Setting,\n  Modal,\n  ItemView,\n  MarkdownView,''')

          one('''const CONNECTIONS_END_MARKER = "<!-- colori-connections:end -->";\n''', '''const CONNECTIONS_END_MARKER = "<!-- colori-connections:end -->";\nconst COLORI_VIEW_TYPE = "colori-sidebar";\n''')

          one('''  h6Size: 16,\n  graphMatchNoteColors: false,\n  overrides: [],''', '''  h6Size: 16,\n  graphMatchNoteColors: false,\n  safeLinksDefault: true,\n  safeLinkOverrides: [],\n  overrides: [],''')

          one('''function normalizeConnection(raw) {''', '''function normalizeSafeLinkOverride(raw) {\n  if (!raw || typeof raw !== "object") return null;\n  const path = sanitizePath(raw.path);\n  if (!path || typeof raw.enabled !== "boolean") return null;\n  return { path, enabled: raw.enabled };\n}\n\nfunction normalizeConnection(raw) {''')

          one('''  const result = { ...DEFAULT_SETTINGS, overrides: [], folderHubs: [], connections: [] };''', '''  const result = { ...DEFAULT_SETTINGS, overrides: [], folderHubs: [], connections: [], safeLinkOverrides: [] };''')

          one('''  result.graphMatchNoteColors = source.graphMatchNoteColors === true;\n\n  if (Array.isArray(source.overrides)) {''', '''  result.graphMatchNoteColors = source.graphMatchNoteColors === true;\n  result.safeLinksDefault = source.safeLinksDefault !== false;\n\n  if (Array.isArray(source.safeLinkOverrides)) {\n    const seen = new Set();\n    for (const rawOverride of source.safeLinkOverrides) {\n      const override = normalizeSafeLinkOverride(rawOverride);\n      if (!override || seen.has(override.path)) continue;\n      seen.add(override.path);\n      result.safeLinkOverrides.push(override);\n    }\n  }\n\n  if (Array.isArray(source.overrides)) {''')

          old_commands = '''    this.addCommand({\n      id: "defang-urls",\n      name: "Defang URLs",\n      editorCallback: (editor) => this.defangEditorUrls(editor)\n    });\n\n    this.registerEvent(\n      this.app.workspace.on("editor-menu", (menu, editor) => {\n        menu.addItem((item) => {\n          item\n            .setTitle("Defang URLs")\n            .setIcon("unlink")\n            .onClick(() => this.defangEditorUrls(editor));\n        });\n      })\n    );\n\n    this.registerEvent(\n      this.app.workspace.on("layout-change", () => this.applyGraphNodeColors())\n    );\n'''
          new_commands = '''    this.registerView(COLORI_VIEW_TYPE, (leaf) => new ColoriSidebarView(leaf, this));\n\n    this.addRibbonIcon("palette", "Open Colori", () => this.openSidebar());\n\n    this.addCommand({\n      id: "open-colori-sidebar",\n      name: "Open sidebar",\n      callback: () => this.openSidebar()\n    });\n\n    this.addCommand({\n      id: "defang-urls",\n      name: "Defang selection or current note",\n      callback: () => this.transformCurrentNote("defang", true)\n    });\n\n    this.addCommand({\n      id: "refang-urls",\n      name: "Refang selection or current note",\n      callback: () => this.transformCurrentNote("refang", true)\n    });\n\n    this.registerDomEvent(document, "click", (event) => this.handleExternalLinkClick(event), true);\n\n    this.registerEvent(\n      this.app.workspace.on("layout-change", () => this.applyGraphNodeColors())\n    );\n'''
          one(old_commands, new_commands)

          old_defang = s[s.index('  defangEditorUrls(editor) {'):s.index('  getGraphRenderers() {')]
          new_defang = '''  getActiveMarkdownView() {\n    return this.app.workspace.getActiveViewOfType(MarkdownView);\n  }\n\n  getSafeLinksOverride(path) {\n    return this.settings.safeLinkOverrides.find((item) => item.path === path);\n  }\n\n  isSafeLinksEnabled(path) {\n    const override = this.getSafeLinksOverride(path);\n    return override ? override.enabled : this.settings.safeLinksDefault;\n  }\n\n  async setSafeLinksForNote(path, enabled) {\n    const safePath = sanitizePath(path);\n    if (!safePath || typeof enabled !== "boolean") return;\n    const existing = this.getSafeLinksOverride(safePath);\n    if (existing) existing.enabled = enabled;\n    else this.settings.safeLinkOverrides.push({ path: safePath, enabled });\n    await this.saveSettings();\n  }\n\n  async clearSafeLinksOverride(path) {\n    this.settings.safeLinkOverrides = this.settings.safeLinkOverrides.filter((item) => item.path !== path);\n    await this.saveSettings();\n  }\n\n  handleExternalLinkClick(event) {\n    const target = event.target instanceof Element ? event.target.closest("a") : null;\n    if (!target) return;\n    const href = target.getAttribute("href") || "";\n    if (!/^https?:\\/\\//i.test(href)) return;\n\n    const file = this.app.workspace.getActiveFile();\n    if (!(file instanceof TFile) || !this.isSafeLinksEnabled(file.path)) return;\n    if (event.ctrlKey || event.metaKey) return;\n\n    event.preventDefault();\n    event.stopImmediatePropagation();\n    if (!this.safeLinksNoticeShown) {\n      this.safeLinksNoticeShown = true;\n      new Notice("Colori blocked an external link. Ctrl/Cmd-click to open it intentionally.");\n    }\n  }\n\n  async transformCurrentNote(mode, preferSelection = false) {\n    const transform = mode === "refang" ? refangUrlText : defangUrlText;\n    const view = this.getActiveMarkdownView();\n    const file = this.app.workspace.getActiveFile();\n    if (!(file instanceof TFile) || file.extension !== "md") return false;\n\n    if (preferSelection && view?.editor) {\n      const selection = view.editor.getSelection();\n      if (selection) {\n        const updated = transform(selection);\n        if (updated !== selection) view.editor.replaceSelection(updated);\n        this.refreshSidebar();\n        return updated !== selection;\n      }\n    }\n\n    if (view?.editor && view.file?.path === file.path) {\n      const current = view.editor.getValue();\n      const updated = transform(current);\n      if (updated !== current) view.editor.setValue(updated);\n      this.refreshSidebar();\n      return updated !== current;\n    }\n\n    const current = await this.app.vault.read(file);\n    const updated = transform(current);\n    if (updated !== current) await this.app.vault.modify(file, updated);\n    this.refreshSidebar();\n    return updated !== current;\n  }\n\n  async openSidebar() {\n    let leaf = this.app.workspace.getLeavesOfType(COLORI_VIEW_TYPE)[0];\n    if (!leaf) {\n      leaf = this.app.workspace.getRightLeaf(false);\n      if (!leaf) return;\n      await leaf.setViewState({ type: COLORI_VIEW_TYPE, active: true });\n    }\n    this.app.workspace.revealLeaf(leaf);\n  }\n\n  refreshSidebar() {\n    for (const leaf of this.app.workspace.getLeavesOfType(COLORI_VIEW_TYPE)) {\n      if (leaf.view instanceof ColoriSidebarView) leaf.view.render();\n    }\n  }\n\n  extractIocs(text) {\n    const source = typeof text === "string" ? text : "";\n    const unique = (values) => [...new Set(values)].slice(0, 100);\n    const urls = unique(source.match(/\\b(?:https?|hxxps?):\\/\\/[^\\s<>"'`]+/gi) || []);\n    const emails = unique(source.match(/\\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}\\b/gi) || []);\n    const hashes = unique(source.match(/\\b(?:[a-f0-9]{64}|[a-f0-9]{40}|[a-f0-9]{32})\\b/gi) || []);\n    const ipCandidates = source.match(/\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b/g) || [];\n    const ips = unique(ipCandidates.filter((value) => value.split(".").every((part) => Number(part) <= 255)));\n    const domains = unique((source.match(/\\b(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\\.|\\[\\.\\]))+[a-z]{2,63}\\b/gi) || [])\n      .filter((value) => !emails.some((email) => email.toLowerCase().endsWith(`@${value.toLowerCase()}`))));\n    return { urls, ips, domains, hashes, emails };\n  }\n\n  getNoteMetadata(file, text) {\n    const resolved = this.app.metadataCache.resolvedLinks || {};\n    const outgoing = resolved[file.path] ? Object.keys(resolved[file.path]).length : 0;\n    let backlinks = 0;\n    for (const links of Object.values(resolved)) {\n      if (links && Object.prototype.hasOwnProperty.call(links, file.path)) backlinks++;\n    }\n    const words = (text.match(/\\S+/g) || []).length;\n    return { words, outgoing, backlinks };\n  }\n\n'''
          s = s.replace(old_defang, new_defang, 1)

          one('''    for (const override of this.settings.overrides) {\n      if (override.path === safeOldPath) {''', '''    for (const safeLink of this.settings.safeLinkOverrides) {\n      if (safeLink.path === safeOldPath) {\n        safeLink.path = newPath;\n        changed = true;\n      } else if (file instanceof TFolder && safeLink.path.startsWith(`${safeOldPath}/`)) {\n        safeLink.path = `${newPath}${safeLink.path.slice(safeOldPath.length)}`;\n        changed = true;\n      }\n    }\n\n    for (const override of this.settings.overrides) {\n      if (override.path === safeOldPath) {''')

          one('''    const beforeOverrides = this.settings.overrides.length;\n    this.settings.overrides = this.settings.overrides.filter(''', '''    const beforeSafeLinks = this.settings.safeLinkOverrides.length;\n    this.settings.safeLinkOverrides = this.settings.safeLinkOverrides.filter(\n      (override) => !pathMatchesOrDescends(override.path, deletedPath)\n    );\n\n    const beforeOverrides = this.settings.overrides.length;\n    this.settings.overrides = this.settings.overrides.filter(''')

          one('''      this.settings.overrides.length !== beforeOverrides ||\n      this.settings.folderHubs.length !== beforeHubs ||''', '''      this.settings.safeLinkOverrides.length !== beforeSafeLinks ||\n      this.settings.overrides.length !== beforeOverrides ||\n      this.settings.folderHubs.length !== beforeHubs ||''')

          one('''    this.settings = { ...DEFAULT_SETTINGS, overrides: [], folderHubs: [], connections: [] };''', '''    this.settings = { ...DEFAULT_SETTINGS, overrides: [], folderHubs: [], connections: [], safeLinkOverrides: [] };''')

          # Add refang helper next to defang helper.
          one('''function hexToGraphColor(value) {''', '''function refangUrlText(value) {\n  if (typeof value !== "string" || !value) return value;\n  return value.replace(/\\bhxxps?:\\/\\/[^\\s<>"'`]+/gi, (url) => {\n    const protocol = url.toLowerCase().startsWith("hxxps://") ? "https://" : "http://";\n    return protocol + url.slice(url.indexOf("://") + 3).replace(/\\[\\.\\]/g, ".");\n  });\n}\n\nfunction hexToGraphColor(value) {''')

          # Replace Settings Tools/Graph block with Safe Links + sidebar-oriented wording.
          old_settings = '''    this.addSection("Tools");\n    new Setting(containerEl)\n      .setName("Defang URLs")\n      .setDesc("Use the command palette or editor context menu to turn HTTP/HTTPS URLs into non-clickable hxxp/hxxps and [.] notation.");\n\n    this.addSection("Graph");\n'''
          new_settings = '''    this.addSection("Safe Links");\n    new Setting(containerEl)\n      .setName("Block normal external-link clicks")\n      .setDesc("Global default. When enabled, external HTTP/HTTPS links require Ctrl/Cmd-click. Individual notes can override this from the Colori sidebar.")\n      .addToggle((toggle) =>\n        toggle.setValue(this.plugin.settings.safeLinksDefault).onChange(async (value) => {\n          this.plugin.settings.safeLinksDefault = value === true;\n          await this.plugin.saveSettings();\n          this.plugin.refreshSidebar();\n        })\n      );\n\n    this.addSection("Sidebar tools");\n    new Setting(containerEl)\n      .setName("Colori sidebar")\n      .setDesc("Open the sidebar from the ribbon or Command Palette for Safe Links, Defang/Refang, IOC extraction, appearance, Graph controls, and note metadata.")\n      .addButton((button) => button.setButtonText("Open sidebar").onClick(() => this.plugin.openSidebar()));\n\n    this.addSection("Graph");\n'''
          one(old_settings, new_settings)

          # Add sidebar class before launcher modal.
          marker = 'class ColoriLauncherModal extends Modal {'
          if marker not in s:
              raise SystemExit('Sidebar insertion marker not found')
          sidebar = r'''class ColoriSidebarView extends ItemView {
  constructor(leaf, plugin) {
    super(leaf);
    this.plugin = plugin;
  }

  getViewType() {
    return COLORI_VIEW_TYPE;
  }

  getDisplayText() {
    return "Colori";
  }

  getIcon() {
    return "palette";
  }

  async onOpen() {
    this.registerEvent(this.app.workspace.on("active-leaf-change", () => this.render()));
    this.registerEvent(this.app.workspace.on("file-open", () => this.render()));
    await this.render();
  }

  async render() {
    const container = this.containerEl.children[1];
    if (!container) return;
    container.empty();
    container.addClass("ct-sidebar");

    const file = this.app.workspace.getActiveFile();
    container.createEl("h3", { text: "Colori" });

    if (!(file instanceof TFile) || file.extension !== "md") {
      container.createEl("p", { text: "Open a Markdown note to use Colori tools.", cls: "ct-muted" });
      return;
    }

    const text = await this.app.vault.cachedRead(file);
    const section = (title) => container.createEl("h4", { text: title, cls: "ct-sidebar-section" });

    container.createEl("div", { text: file.basename, cls: "ct-sidebar-note" });
    container.createEl("div", { text: file.path, cls: "ct-sidebar-path" });

    section("Safe Links");
    const safe = this.plugin.isSafeLinksEnabled(file.path);
    const safeRow = new Setting(container).setName("Block normal clicks");
    safeRow.addToggle((toggle) =>
      toggle.setValue(safe).onChange(async (value) => {
        await this.plugin.setSafeLinksForNote(file.path, value === true);
        this.render();
      })
    );
    const safeOverride = this.plugin.getSafeLinksOverride(file.path);
    if (safeOverride) {
      new Setting(container)
        .setName("Note override")
        .setDesc(`This note overrides the global ${this.plugin.settings.safeLinksDefault ? "ON" : "OFF"} default.`)
        .addButton((button) => button.setButtonText("Use global").onClick(async () => {
          await this.plugin.clearSafeLinksOverride(file.path);
          this.render();
        }));
    }

    section("Defang / Refang");
    const tools = container.createDiv({ cls: "ct-sidebar-actions" });
    const defang = tools.createEl("button", { text: "Defang" });
    defang.addEventListener("click", async () => {
      await this.plugin.transformCurrentNote("defang", true);
      this.render();
    });
    const refang = tools.createEl("button", { text: "Refang" });
    refang.addEventListener("click", async () => {
      await this.plugin.transformCurrentNote("refang", true);
      this.render();
    });
    container.createEl("p", { text: "Selection first; otherwise the whole current note.", cls: "ct-muted" });

    section("Indicators");
    const iocs = this.plugin.extractIocs(text);
    const types = [
      ["URLs", iocs.urls],
      ["IPs", iocs.ips],
      ["Domains", iocs.domains],
      ["Hashes", iocs.hashes],
      ["Emails", iocs.emails]
    ];
    let total = 0;
    for (const [label, values] of types) {
      total += values.length;
      if (!values.length) continue;
      container.createEl("div", { text: `${label} (${values.length})`, cls: "ct-ioc-label" });
      for (const value of values.slice(0, 20)) {
        const row = container.createDiv({ cls: "ct-ioc-row" });
        row.createEl("code", { text: value });
        const copy = row.createEl("button", { text: "Copy" });
        copy.addEventListener("click", () => navigator.clipboard.writeText(value));
      }
    }
    if (!total) container.createEl("p", { text: "No common IOCs detected in this note.", cls: "ct-muted" });
    if (total) {
      const all = types.flatMap(([, values]) => values);
      const copyAll = container.createEl("button", { text: "Copy all IOCs", cls: "ct-sidebar-wide-button" });
      copyAll.addEventListener("click", () => navigator.clipboard.writeText([...new Set(all)].join("\n")));
    }

    section("Appearance");
    const existing = this.plugin.getOverride("file", file.path);
    const appearance = existing
      ? { ...existing }
      : { color: this.plugin.settings.noteColor, size: this.plugin.settings.noteSize, icon: "" };

    new Setting(container).setName("Title color").addColorPicker((picker) =>
      picker.setValue(appearance.color).onChange(async (value) => {
        appearance.color = sanitizeColor(value, this.plugin.settings.noteColor);
        await this.plugin.upsertOverride("file", file.path, appearance);
      })
    );
    new Setting(container).setName("Title size").addSlider((slider) =>
      slider.setLimits(10, 40, 1).setValue(appearance.size).setDynamicTooltip().onChange(async (value) => {
        appearance.size = sanitizeSize(value, 10, 40, this.plugin.settings.noteSize);
        await this.plugin.upsertOverride("file", file.path, appearance);
      })
    );
    new Setting(container).setName("Icon").addText((input) =>
      input.setPlaceholder("Optional").setValue(appearance.icon || "").onChange(async (value) => {
        appearance.icon = sanitizeIcon(value);
        await this.plugin.upsertOverride("file", file.path, appearance);
      })
    );
    if (existing) {
      const reset = container.createEl("button", { text: "Reset appearance", cls: "ct-sidebar-wide-button" });
      reset.addEventListener("click", async () => {
        await this.plugin.removeOverride("file", file.path);
        this.render();
      });
    }

    section("Graph");
    new Setting(container).setName("Match note colors").addToggle((toggle) =>
      toggle.setValue(this.plugin.settings.graphMatchNoteColors).onChange(async (value) => {
        this.plugin.settings.graphMatchNoteColors = value === true;
        await this.plugin.saveSettings();
      })
    );
    const count = this.plugin.getOutgoingConnections(file.path).length;
    const graphActions = container.createDiv({ cls: "ct-sidebar-actions" });
    const connect = graphActions.createEl("button", { text: "Connect note" });
    connect.addEventListener("click", () => {
      new NoteSuggestModal(this.app, file.path, async (target) => {
        await this.plugin.addConnection(file, target);
        this.render();
      }).open();
    });
    const manage = graphActions.createEl("button", { text: `Connections (${count})` });
    manage.addEventListener("click", () => new ConnectionsModal(this.app, this.plugin, file).open());

    section("Note info");
    const info = this.plugin.getNoteMetadata(file, text);
    const infoGrid = container.createDiv({ cls: "ct-note-info" });
    const addInfo = (name, value) => {
      infoGrid.createEl("span", { text: name, cls: "ct-note-info-label" });
      infoGrid.createEl("span", { text: String(value), cls: "ct-note-info-value" });
    };
    addInfo("Words", info.words);
    addInfo("Backlinks", info.backlinks);
    addInfo("Outgoing", info.outgoing);
    addInfo("Created", new Date(file.stat.ctime).toLocaleString());
    addInfo("Modified", new Date(file.stat.mtime).toLocaleString());

    const refresh = container.createEl("button", { text: "Refresh", cls: "ct-sidebar-wide-button" });
    refresh.addEventListener("click", () => this.render());
  }

  async onClose() {
    this.containerEl.empty();
  }
}

'''
          s = s.replace(marker, sidebar + marker, 1)

          p.write_text(s, encoding='utf-8')

          css = Path('styles.css')
          cs = css.read_text(encoding='utf-8')
          cs += r'''

/* Colori sidebar */
.ct-sidebar {
  padding: 10px 12px 24px;
  overflow-y: auto;
}

.ct-sidebar h3 {
  margin: 4px 0 12px;
}

.ct-sidebar-note {
  font-weight: 600;
  font-size: var(--font-ui-medium);
}

.ct-sidebar-path {
  margin-top: 3px;
  color: var(--text-muted);
  font-size: var(--font-ui-smaller);
  word-break: break-all;
}

.ct-sidebar-section {
  margin: 20px 0 6px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--background-modifier-border);
  font-size: var(--font-ui-small);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.ct-sidebar .setting-item {
  padding: 8px 0;
  border-top: none;
}

.ct-sidebar-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.ct-sidebar-actions button,
.ct-sidebar-wide-button {
  width: 100%;
}

.ct-sidebar-wide-button {
  margin-top: 8px;
}

.ct-ioc-label {
  margin: 10px 0 4px;
  font-size: var(--font-ui-smaller);
  font-weight: 600;
  color: var(--text-muted);
}

.ct-ioc-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px;
  align-items: center;
  margin: 4px 0;
}

.ct-ioc-row code {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ct-ioc-row button {
  padding: 2px 7px;
  font-size: var(--font-ui-smaller);
}

.ct-note-info {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 5px 12px;
  font-size: var(--font-ui-small);
}

.ct-note-info-label {
  color: var(--text-muted);
}

.ct-note-info-value {
  text-align: right;
  overflow-wrap: anywhere;
}
'''
          css.write_text(cs, encoding='utf-8')

          manifest = Path('manifest.json')
          manifest.write_text('''{\n  "id": "colori-dev",\n  "name": "Colori Dev",\n  "version": "1.4.0-beta.1",\n  "minAppVersion": "1.13.7",\n  "description": "Development build of Colori with a sidebar workspace, Safe Links, IOC tools, appearance controls, and graph features.",\n  "author": "H4d33r",\n  "isDesktopOnly": false\n}\n''', encoding='utf-8')

      - name: Syntax check
        run: node --check main.js
      - name: Commit dev sidebar build
        run: |
          git config user.name "H4d33r"
          git config user.email "79756288+h4d33r@users.noreply.github.com"
          git add main.js styles.css manifest.json
          git commit -m "feat: add Colori sidebar workspace and Safe Links"
          git push origin dev
