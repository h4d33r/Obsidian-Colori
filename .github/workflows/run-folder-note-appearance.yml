name: Run folder note appearance patch

on:
  push:
    branches:
      - dev
    paths:
      - .github/run-folder-note-appearance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/scripts/add_folder_note_appearance.py
      - run: node --check main.js
      - run: |
          git config user.name "H4d33r"
          git config user.email "79756288+h4d33r@users.noreply.github.com"
          git add main.js styles.css manifest.json versions.json
          git diff --cached --check
          git commit -m "feat: add folder note appearance inheritance"
          git push origin dev
