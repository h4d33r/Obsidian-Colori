name: Run Appearance v8 patch

on:
  push:
    branches:
      - dev
    paths:
      - .github/run-appearance-v8

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/scripts/fix_appearance_v8.py
      - run: node --check main.js
      - run: |
          git config user.name "H4d33r"
          git config user.email "79756288+h4d33r@users.noreply.github.com"
          git add main.js styles.css
          git diff --cached --check
          git commit -m "fix: rebuild appearance controls layout"
          git push origin dev
