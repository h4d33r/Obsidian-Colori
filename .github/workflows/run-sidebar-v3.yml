name: Run sidebar UX patch

on:
  push:
    branches: [dev]
    paths:
      - .github/run-sidebar-v3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/scripts/patch_sidebar_v3.py
      - run: node --check main.js
      - run: |
          git config user.name "H4d33r"
          git config user.email "79756288+h4d33r@users.noreply.github.com"
          git add main.js styles.css
          git commit -m "fix: stabilize Note Tools and IOC scanner UX"
          git push origin dev
